# A test suite must not depend on the developer's environment. Without these, every context test
# would fail on an unresolved ${MONGODB_URI} placeholder — on this machine and on anyone else's.
#
# The Mongo client is created lazily, so pointing it at a host nobody listens on is harmless as long
# as no test actually queries: repositories are replaced by mocks where a test needs data.
spring.mongodb.uri=mongodb://localhost:27017
spring.mongodb.database=accesscontrol-test

# Fixed values, so a test can mint a token the application will accept.
syekso.jwt.secret=secret-de-test
syekso.jwt.issuer=accesscontrol
syekso.jwt.audience=accesscontrol-app
syekso.intercom-key=cle-de-test

syekso.signaling.ring-timeout-ms=1000

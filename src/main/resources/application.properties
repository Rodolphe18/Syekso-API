# 8080 is the port the Android apps are built against — BASE_URL and network_security_config.xml both
# name 192.168.1.104:8080. SERVER_PORT overrides it — useful to bring a second instance up beside a
# running one without stopping it.
server.port=${SERVER_PORT:8080}

spring.application.name=accesscontrol

# The credentials stay in the environment and never in the repository. They live in the IntelliJ run
# configuration, which is also why nothing but that configuration can start this application.
#
# Spring Boot 4 renamed these: spring.data.mongodb.* was retired in 4.0.0 in favour of
# spring.mongodb.*. The old names are kept in the metadata at deprecation level "error" purely so
# tooling can flag them — Spring itself ignores them, silently, and falls back to the default
# mongodb://localhost/test. No placeholder error, no warning, just a client pointed at localhost.
# Most documentation online is still 3.x, so expect this trap again elsewhere.
#
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DB:accesscontrol}

# Jackson's null handling is left at its default ("always"), and that is a decision, not an oversight.
# Omitting nulls would be the cleaner contract in the abstract — but the two Android apps parse this
# JSON with kotlinx.serialization, and a field they declare non-nullable without a default fails to
# parse the moment the server stops sending it. They will not be redeployed for the server's benefit.
# So: do not set spring.jackson.default-property-inclusion without checking the apps' DTOs first.

# Shared secret the intercom device presents in X-Intercom-Key. The intercom app ships the same
# default; change it on one side only and validation silently starts refusing every code.
syekso.intercom-key=${INTERCOM_KEY:syekso-demo-intercom-key}

# How long an intercom rings before the server gives up and tells both sides.
syekso.signaling.ring-timeout-ms=30000

syekso.jwt.secret=${JWT_SECRET:dev-secret-change-me}
syekso.jwt.issuer=accesscontrol
syekso.jwt.audience=accesscontrol-app
